[package]
name = "sagapay"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["SagaPay Team <support@sagapay.net>"]
description = "Rust SDK for SagaPay - The world's first free, non-custodial blockchain payment gateway"
license = "MIT"
repository = "https://github.com/rootdigit/sagapay-rust"
homepage = "https://sagapay.net"
documentation = "https://docs.rs/sagapay"
keywords = ["blockchain", "payment", "cryptocurrency", "fintech", "sagapay"]
categories = ["api-bindings", "finance", "web-programming"]
readme = "readme.md"


[dependencies]
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
chrono = { version = "0.4.45", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }